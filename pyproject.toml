[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sf311"
version = "0.1.0"
description = "Route San Francisco 311 requests from photos and predict resolution time"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pillow>=10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Install torch from the CPU index: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[ml]"
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "matplotlib>=3.8",
]
clip = ["open_clip_torch>=2.24"]
llm = ["anthropic>=0.40"]
demo = ["streamlit>=1.40", "pydeck>=0.9"]
notebooks = ["matplotlib>=3.8", "jupyter>=1.0", "nbformat>=5.9", "nbconvert>=7.16", "ipykernel>=6.29"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # long lines are left to the formatter
    "B008",  # FastAPI File()/Form() defaults are idiomatic
    "B905",  # zip(strict=) not required
]
